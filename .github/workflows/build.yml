name: Build Forge Mod
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Force Gradle 8.8
        run: |
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.8-bin.zip#' gradle/wrapper/gradle-wrapper.properties || true
      - name: Build
        run: ./gradlew --no-daemon --stacktrace build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phonkedit-forge-jar
          path: build/libs/*.jar
